description: >-
  FinOps view of Updox spend. Updox (part of EverCommerce, NASDAQ - EVCM) is a
  subscription SaaS platform billed monthly by practice size and capability mix,
  with tier allowances on faxes, telehealth sessions, appointment reminders, and
  broadcast messages. The public API is a partner integration surface enabled on
  top of that subscription rather than a separately metered consumption API, so
  the dominant cost driver is the subscription tier and overage against its
  allowances, not per-API-call charges. Exact rates are quote-based and not
  reconciled here.
notes: >-
  Because pricing is quote-based and tier allowances vary, model Updox spend from
  your negotiated subscription plus any overage on capped resources (fax pages,
  telehealth sessions, reminders, broadcast messages). Verify current rates with
  Updox sales.
