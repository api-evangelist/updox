principles:
- name: Visibility
  description: Track usage of capped resources (fax pages, telehealth sessions, reminders, broadcast messages) against the plan allowance to anticipate overage.
- name: Allocation
  description: Map Updox seats and capability usage to practices, locations, or departments.
- name: Optimization
  description: Right-size the subscription tier to actual volume; consolidate capabilities that would otherwise be bought from separate vendors (fax, telehealth, reminders).
- name: Accountability
  description: Assign an owner for the Updox contract and review monthly usage vs. allowance and renewal terms.
