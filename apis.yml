apis:
- aid: updox:updox-address-book-api
  name: Updox Address Book API
  tags:
  - Contacts
  - Address Book
  - Patients
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://help.updox.com/help/public-api
  baseURL: https://updoxqa.com/api/io
  properties:
  - url: https://help.updox.com/help/public-api
    type: Documentation
  - url: https://updoxqa.com/api/newio
    type: APIReference
  - url: openapi/updox-openapi.yml
    type: OpenAPI
  description: List, search, and create contacts in a practice-level address book -
    AddressBookList (with an international-address v1.1), AddressBookSearch by criteria,
    and ContactCreate. These POST actions are confirmed in Updox's IO Docs explorer.
- aid: updox:updox-faxing-api
  name: Updox Faxing API
  tags:
  - Fax
  - Electronic Fax
  - Documents
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://help.updox.com/help/faxoempop
  baseURL: https://updoxqa.com/api/io
  properties:
  - url: https://help.updox.com/help/faxoempop
    type: Documentation
  - url: https://help.updox.com/help/faxing-webhooks
    type: Documentation
  - url: openapi/updox-openapi.yml
    type: OpenAPI
  description: Send and retrieve electronic faxes. FaxOemPop and PopPDF are multifunction
    poll endpoints that report whether inbound faxes are queued, return the fax image
    (PNG or PDF) in the JSON response, and mark it handled via lastRetrievedFaxId until
    endOfQueue. Faxing webhooks notify partners of inbound/outbound fax events.
