name: Updox
kind: company
description: Updox is a healthcare communication and patient engagement platform for
  in-person and virtual care, offering a single inbox for secure/direct messaging,
  electronic fax, document management, patient reminders, forms, and telehealth video
  chat, integrated with 100+ EHR and pharmacy management systems. Updox has been a
  part of EverCommerce (NASDAQ - EVCM) since its December 2020 acquisition. Updox
  exposes a documented public/partner API (an IO Docs explorer plus a knowledge-base
  API reference) used mainly by EHR, pharmacy, and integration partners; API access
  is granted via application credentials rather than open self-serve signup, and much
  of the endpoint surface below is modeled from Updox's documented functional areas
  and webhook catalog.
